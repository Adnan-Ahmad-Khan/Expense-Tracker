<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker — Edit Expense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ── NAVBAR ─────────────────────────────── -->
    <nav class="et-nav">
        <a href="{{ url_for('home') }}" class="et-nav__brand">
            <span class="et-nav__brand-dot"></span>Expense Tracker
        </a>
        <div class="et-nav__links">
            <span class="et-nav__user">Hi, {{ user.name.split()[0] }} 👋</span>
            <a href="{{ url_for('home') }}" class="et-nav__link">Dashboard</a>
            <a href="{{ url_for('analytics') }}" class="et-nav__link">Analytics</a>
            <a href="{{ url_for('expense_history') }}" class="et-nav__link">History</a>
            <a href="{{ url_for('logout') }}" class="et-nav__link" style="color:var(--red-soft);">Logout</a>
            <label class="et-toggle" title="Toggle theme">
                <input type="checkbox" id="themeToggle">
                <span id="themeIcon">☀</span>
            </label>
        </div>
    </nav>

    <div class="et-page">
        <div class="et-edit-wrap">

            <!-- BACK LINK -->
            <a href="{{ url_for('expense_history') }}" style="font-size:0.82rem; color:var(--text-3); text-decoration:none;
              display:inline-flex; align-items:center; gap:5px; margin-bottom:20px;">
                ← Back to History
            </a>

            <!-- PAGE HEADER -->
            <div class="et-page-header" style="margin-bottom:20px;">
                <h1>Edit Expense</h1>
                <p>Update the details below and save</p>
            </div>

            <!-- META CHIP — original date -->
            <div style="margin-bottom:20px;">
                <span style="
        display:inline-flex; align-items:center; gap:6px;
        background:var(--surface-2); border:1px solid var(--border);
        border-radius:20px; padding:5px 12px;
        font-size:0.75rem; color:var(--text-2); font-weight:500;">
                    📅 Originally added: {{ expense.date.strftime('%d %b %Y, %I:%M %p') }}
                </span>
            </div>

            <!-- FORM CARD -->
            <div class="et-card">
                <div class="et-card__body--lg">
                    <form method="POST">
                        <div class="et-stack">

                            <!-- Amount -->
                            <div>
                                <label class="et-form-label">Amount (₹)</label>
                                <input type="number" step="0.01" name="amount" value="{{ expense.amount }}"
                                    class="et-input" required>
                            </div>

                            <!-- Category -->
                            <div>
                                <label class="et-form-label">Category</label>
                                <select name="category" class="et-input" required>
                                    {% set cats = [
                                    ('Food & Drinks', '🍽️'),
                                    ('Travel', '✈️'),
                                    ('Shopping', '🛍️'),
                                    ('Transportation','🚗'),
                                    ('Entertainment', '⭐'),
                                    ('Services', '💻'),
                                    ('Health', '❤️'),
                                    ('Home', '🏠'),
                                    ('Utilities', '⚡'),
                                    ('Others', '📌'),
                                    ] %}
                                    {% for cat, emoji in cats %}
                                    <option value="{{ cat }}" {% if expense.category==cat %}selected{% endif %}>
                                        {{ emoji }} {{ cat }}
                                    </option>
                                    {% endfor %}
                                    <!-- If expense has a custom category not in presets, show it too -->
                                    {% set preset_names = ['Food &
                                    Drinks','Travel','Shopping','Transportation','Entertainment','Services','Health','Home','Utilities','Others']
                                    %}
                                    {% if expense.category not in preset_names %}
                                    <option value="{{ expense.category }}" selected>📌 {{ expense.category }}</option>
                                    {% endif %}
                                </select>
                            </div>

                            <!-- Notes -->
                            <div>
                                <label class="et-form-label">Notes (optional)</label>
                                <input type="text" name="notes" value="{{ expense.notes or '' }}" class="et-input"
                                    placeholder="e.g. Team lunch, Flight ticket…">
                            </div>

                            <!-- Recurring -->
                            <div>
                                <label class="et-check-row">
                                    <input type="checkbox" name="is_recurring" id="recurringCheck" {% if
                                        expense.is_recurring %}checked{% endif %}>
                                    <span>Recurring expense</span>
                                </label>
                                <div class="et-recurrence-select {% if expense.is_recurring %}visible{% endif %}"
                                    id="recurrenceWrap">
                                    <select name="recurrence" class="et-input" style="margin-top:8px;">
                                        <option value="weekly" {% if expense.recurrence=='weekly' %}selected{% endif %}>
                                            Weekly</option>
                                        <option value="monthly" {% if expense.recurrence=='monthly' %}selected{% endif
                                            %}>Monthly</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Divider -->
                            <div style="height:1px; background:var(--border); margin:4px 0;"></div>

                            <!-- Action buttons -->
                            <div style="display:flex; gap:10px;">
                                <button type="submit" class="et-btn et-btn--primary" style="flex:1; padding:11px;">
                                    Save Changes
                                </button>
                                <a href="{{ url_for('expense_history') }}" class="et-btn et-btn--ghost"
                                    style="flex:1; padding:11px; text-align:center;">
                                    Cancel
                                </a>
                            </div>

                            <!-- Danger zone -->
                            <div style="
              border:1px solid rgba(220,38,38,0.15);
              border-radius:var(--radius-sm);
              padding:14px 16px;
              display:flex; justify-content:space-between; align-items:center;
              gap:12px; background:var(--red-soft);">
                                <div>
                                    <div
                                        style="font-size:0.78rem; font-weight:700; color:var(--red); margin-bottom:2px;">
                                        Danger Zone</div>
                                    <div style="font-size:0.75rem; color:var(--text-2);">Permanently delete this expense
                                    </div>
                                </div>
                                <a href="{{ url_for('delete', id=expense.id) }}" class="et-btn et-btn--danger-ghost"
                                    onclick="return confirm('Permanently delete this expense? This cannot be undone.')">
                                    Delete
                                </a>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div><!-- /et-page -->

    <!-- ── SCRIPTS ────────────────────────────── -->
    <script>
        // Recurring toggle
        document.getElementById('recurringCheck').addEventListener('change', function () {
            document.getElementById('recurrenceWrap').classList.toggle('visible', this.checked);
        });

        // Theme
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const root = document.documentElement;
        const saved = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-theme', saved);
        toggle.checked = saved === 'dark';
        icon.textContent = saved === 'dark' ? '☽' : '☀';
        toggle.addEventListener('change', () => {
            const t = toggle.checked ? 'dark' : 'light';
            root.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            icon.textContent = t === 'dark' ? '☽' : '☀';
        });
    </script>

</body>

</html>
