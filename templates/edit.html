<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Expense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="et-nav">
        <a href="{{ url_for('home') }}" class="et-nav__brand">
            <span class="et-nav__brand-dot"></span>Expense Tracker
        </a>
        <div class="et-nav__links">
            <a href="{{ url_for('home') }}" class="et-nav__link">Dashboard</a>
            <a href="{{ url_for('analytics') }}" class="et-nav__link">Analytics</a>
            <a href="{{ url_for('expense_history') }}" class="et-nav__link">History</a>
            <label class="et-toggle" title="Toggle theme">
                <input type="checkbox" id="themeToggle">
                <span id="themeIcon">☀</span>
            </label>
        </div>
    </nav>

    <div class="et-page">
        <div class="et-edit-wrap">
            <div class="et-page-header">
                <h1>Edit Expense</h1>
                <p>Update the details below</p>
            </div>
            <div class="et-card">
                <div class="et-card__body--lg">
                    <form method="POST">
                        <div class="et-stack">
                            <div>
                                <label class="et-form-label">Amount (₹)</label>
                                <input type="number" step="0.01" name="amount" value="{{ expense.amount }}"
                                    class="et-input" required>
                            </div>
                            <div>
                                <label class="et-form-label">Category</label>
                                <input type="text" name="category" value="{{ expense.category }}" class="et-input"
                                    required>
                            </div>
                            <div style="display:flex; gap:10px; margin-top:8px;">
                                <button type="submit" class="et-btn et-btn--primary" style="flex:1;">Update</button>
                                <a href="{{ url_for('home') }}" class="et-btn et-btn--ghost"
                                    style="flex:1; text-align:center; text-decoration:none;">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const root = document.documentElement;
        const saved = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-theme', saved);
        toggle.checked = saved === 'dark';
        icon.textContent = saved === 'dark' ? '☽' : '☀';
        toggle.addEventListener('change', () => {
            const t = toggle.checked ? 'dark' : 'light';
            root.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            icon.textContent = t === 'dark' ? '☽' : '☀';
        });
    </script>
</body>

</html>
