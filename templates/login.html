<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="et-theme-corner">
        <label class="et-toggle" title="Toggle theme">
            <input type="checkbox" id="themeToggle">
            <span id="themeIcon">☀</span>
        </label>
    </div>

    <div class="et-auth-page">
        <div class="et-auth-blob et-auth-blob--1"></div>
        <div class="et-auth-blob et-auth-blob--2"></div>

        <div class="et-auth-card">

            <div class="et-auth-card__brand">
                <span
                    style="width:9px;height:9px;background:var(--accent);border-radius:50%;display:inline-block;animation:pulse 2.5s infinite;"></span>
                Expense Tracker
            </div>

            <div class="et-auth-card__title">Welcome back</div>
            <div class="et-auth-card__sub">Sign in to your account to continue</div>

            {% if error %}
            <div class="et-error-box">⚠ {{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="et-stack">

                    <div>
                        <label class="et-form-label">Email address</label>
                        <div class="et-input-wrap">
                            <span class="et-input-icon">✉</span>
                            <input type="email" name="email" class="et-input" placeholder="you@example.com"
                                autocomplete="email" required>
                        </div>
                    </div>

                    <div>
                        <label class="et-form-label">Password</label>
                        <div class="et-input-wrap">
                            <span class="et-input-icon">🔒</span>
                            <input type="password" name="password" class="et-input" placeholder="••••••••"
                                autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="et-btn et-btn--primary et-btn--full et-btn-magnetic"
                        style="margin-top:4px; padding:11px;">
                        Sign in →
                    </button>

                </div>
            </form>

            <div style="display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:0.73rem;margin:20px 0;">
                <div style="flex:1;height:1px;background:var(--border);"></div>
                or
                <div style="flex:1;height:1px;background:var(--border);"></div>
            </div>

            <div class="et-auth-card__footer">
                Don't have an account? <a href="{{ url_for('register') }}">Create one free</a>
            </div>

            <div style="text-align:center; margin-top:10px;">
                <a href="{{ url_for('landing') }}"
                    style="font-size:0.75rem; color:var(--text-3); text-decoration:none;">
                    ← Back to home
                </a>
            </div>

        </div>
    </div>

    <script>
        // Magnetic button
        document.querySelectorAll('.et-btn-magnetic').forEach(btn => {
            btn.addEventListener('mousemove', e => {
                const r = btn.getBoundingClientRect();
                btn.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.15}px,${(e.clientY - r.top - r.height / 2) * 0.15}px)`;
            });
            btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
        });

        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const root = document.documentElement;
        const saved = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-theme', saved);
        toggle.checked = saved === 'dark';
        icon.textContent = saved === 'dark' ? '☽' : '☀';
        toggle.addEventListener('change', () => {
            const t = toggle.checked ? 'dark' : 'light';
            root.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            icon.textContent = t === 'dark' ? '☽' : '☀';
        });
    </script>
</body>

</html>
