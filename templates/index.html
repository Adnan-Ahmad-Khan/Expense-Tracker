<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        .card {
            border-radius: 12px;
            background-color: #ffffff;
            color: #212529;
        }

        /* ================= DARK MODE ================= */

        body.dark {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }

        body.dark .container {
            background-color: #121212 !important;
        }

        body.dark .navbar {
            background-color: #1e1e1e !important;
        }

        body.dark .card {
            background-color: #1e1e1e !important;
            color: #e0e0e0 !important;
            border-color: #2c2c2c !important;
        }

        body.dark h1,
        body.dark h2,
        body.dark h3,
        body.dark h4,
        body.dark h5,
        body.dark h6,
        body.dark p,
        body.dark li,
        body.dark label {
            color: #e0e0e0 !important;
        }

        body.dark .text-muted {
            color: #aaaaaa !important;
        }

        body.dark input,
        body.dark select {
            background-color: #2c2c2c !important;
            color: #e0e0e0 !important;
            border-color: #444 !important;
        }

        body.dark input::placeholder {
            color: #999 !important;
        }

        body.dark .btn-secondary {
            background-color: #444 !important;
            border-color: #444 !important;
        }

        /* ===== Charts ===== */
        .chart-container {
            max-width: 320px;
            height: 240px;
            margin: 0 auto;
        }

        .limit-chart-container {
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-semibold" href="#">Expense Tracker</a>
        <button id="themeToggle" class="btn btn-outline-light btn-sm">
            <i class="bi bi-moon"></i>
        </button>

    </nav>

    <div class="container my-4">

        <!-- Total Expense + Monthly Limit -->
        <div class="row mb-4 align-items-center">

            <!-- Total Expense -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Total Expense</h6>
                        <h2 class="fw-bold text-danger">₹ {{ total_expense }}</h2>
                    </div>
                </div>
            </div>

            <!-- Monthly Spending Limit -->
            <div class="col-md-4">
                <div class="card shadow-sm text-center h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <h6>Monthly Limit</h6>

                        <div class="limit-chart-container">
                            <canvas id="limitChart"></canvas>
                        </div>

                        <p class="fw-semibold mt-2 mb-0">
                            ₹ {{ current_month_total }} / ₹ {{ monthly_limit }}
                        </p>
                    </div>
                </div>
            </div>

        </div>





        <!-- Add Expense + Filters -->
        <div class="row g-4 mb-4">

            <!-- Add Expense -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="mb-3">Add Expense</h5>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" class="form-control" name="amount" placeholder="Enter amount"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-control" name="category" placeholder="e.g. Food, Travel"
                                    required>
                            </div>
                            <button class="btn btn-primary w-100">Add Expense</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="mb-3">Filters</h5>
                        <form method="GET">
                            <div class="mb-3">
                                <label class="form-label">Month</label>
                                <select class="form-select" name="month">
                                    <option value="">All Months</option>
                                    {% for m in months %}
                                    <option value="{{ m }}">{{ m }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" name="category">
                                    <option value="">All Categories</option>
                                    {% for c in categories %}
                                    <option value="{{ c }}">{{ c }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button class="btn btn-secondary w-100">Apply Filters</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>

        <!-- Charts -->
        <div class="row g-4 mb-4">

            <!-- LEFT SIDE (Category + Monthly) -->
            <div class="col-md-8">
                <div class="row g-4">

                    <div class="col-md-6">
                        <div class="card shadow-sm text-center">
                            <div class="card-body">
                                <h6>Category Expense</h6>
                                <div class="chart-container">
                                    <canvas id="categoryChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Category Summary + History Link -->
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6>Category-wise Summary</h6>
                            <ul class="mb-3">
                                {% for cat, total in category_data %}
                                <li>{{ cat }} : ₹ {{ total }}</li>
                                {% endfor %}
                            </ul>

                            <div class="text-end">
                                <a href="{{ url_for('expense_history') }}"
                                    class="history-link fw-semibold text-decoration-none">
                                    View Expense History <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>

                <script>
                    // ---- CATEGORY PIE CHART ----
                    const pieLabels = JSON.parse('{{ category_data | map(attribute=0) | list | tojson | safe }}');
                    const pieValues = JSON.parse('{{ category_data | map(attribute=1) | list | tojson | safe }}');

                    new Chart(document.getElementById("categoryChart"), {
                        type: "pie",
                        data: {
                            labels: pieLabels,
                            datasets: [{
                                data: pieValues,
                                backgroundColor: ["#4e73df", "#1cc88a", "#f6c23e", "#e74a3b"]
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });



                    // ---- MONTHLY SPENDING LIMIT CHART ----
                    const spent = JSON.parse('{{ current_month_total | tojson | safe }}');
                    const limit = JSON.parse('{{ monthly_limit | tojson | safe }}');

                    const remaining = Math.max(limit - spent, 0);

                    // Decide color based on spending
                    let limitColor = "#1cc88a"; // green

                    if (spent > limit * 0.8 && spent <= limit) {
                        limitColor = "#f6c23e"; // orange
                    } else if (spent > limit) {
                        limitColor = "#e74a3b"; // dark red
                    }
                    const isDark = document.body.classList.contains("dark");
                    const remainingColor = isDark ? "#2c2c2c" : "#e0e0e0";

                    new Chart(document.getElementById("limitChart"), {
                        type: "doughnut",
                        data: {
                            labels: ["Spent", "Remaining"],
                            datasets: [{
                                data: [spent, remaining],
                                backgroundColor: [limitColor, remainingColor],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: "75%",
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });


                </script>
                <script>
                    const toggleBtn = document.getElementById("themeToggle");

                    // Load saved theme
                    if (localStorage.getItem("theme") === "dark") {
                        document.body.classList.add("dark");
                        toggleBtn.innerHTML = '<i class="bi bi-sun"></i>';
                    }

                    toggleBtn.addEventListener("click", () => {
                        document.body.classList.toggle("dark");

                        const isDark = document.body.classList.contains("dark");
                        localStorage.setItem("theme", isDark ? "dark" : "light");

                        toggleBtn.innerHTML = isDark
                            ? '<i class="bi bi-sun"></i>'
                            : '<i class="bi bi-moon"></i>';
                    });
                </script>


</body>

</html>
