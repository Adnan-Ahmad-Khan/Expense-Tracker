<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-4">

        <a href="{{ url_for('home') }}" class="text-decoration-none">
            ← Back to Dashboard
        </a>

        <h3 class="mt-3 mb-4">Expense History</h3>

        {% if expenses %}
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for exp in expenses %}
                <tr>
                    <td>{{ exp.date.strftime('%d %b %Y') }}</td>
                    <td>{{ exp.category }}</td>
                    <td>₹ {{ exp.amount }}</td>
                    <td>
                        <a href="{{ url_for('edit', id=exp.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{{ url_for('delete', id=exp.id) }}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted">No expenses found.</p>
        {% endif %}

    </div>

</body>

</html>
